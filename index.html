<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LAIA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;height:100dvh;overflow:hidden;background:#050505;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{height:100%;display:flex;flex-direction:column;align-items:center}.name{position:absolute;top:max(25px,env(safe-area-inset-top));left:25px;font-size:13px;letter-spacing:.35em;opacity:.55}.face{position:relative;width:min(90vw,420px);height:280px;margin-top:clamp(70px,12vh,130px);flex:0 0 280px;user-select:none}.eye{position:absolute;top:78px;width:88px;height:88px;border:7px solid #fff;border-radius:50%;transition:height .22s,top .22s,border .22s}.eye.left{left:55px}.eye.right{right:55px}.pupil{position:absolute;width:24px;height:30px;left:25px;top:22px;background:#fff;border-radius:50%;transition:transform .12s}.brow{position:absolute;top:43px;width:68px;height:25px;border-top:7px solid #fff;border-radius:50%;transition:.35s}.brow.left{left:64px;transform:rotate(-8deg)}.brow.right{right:64px;transform:rotate(8deg)}.mouth{position:absolute;left:50%;top:198px;width:52px;height:26px;transform:translateX(-50%);border-bottom:7px solid #fff;border-radius:0 0 50% 50%;transition:.25s}.face.blink .eye{height:8px;top:115px;border-width:0 0 7px}.face.blink .pupil{opacity:0}.face.happy .eye{height:40px;top:100px;border-width:7px 0 0}.face.happy .pupil{opacity:0}.face.happy .mouth{width:78px;height:40px}.face.skeptical .brow.left{top:54px;transform:rotate(17deg)}.face.skeptical .brow.right{top:34px;transform:rotate(-14deg)}.face.skeptical .mouth{width:32px;transform:translateX(-50%) rotate(-8deg)}.face.surprised .mouth{width:32px;height:32px;border:7px solid #fff;border-radius:50%}.face.talking .mouth{animation:talk .18s infinite alternate}@keyframes talk{from{height:14px;width:42px}to{height:38px;width:58px}}.chat{width:min(92vw,620px);flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:max(14px,env(safe-area-inset-bottom))}.messages{flex:1;overflow:auto;padding:4px 8px 12px;scrollbar-width:none}.msg{max-width:82%;margin:8px 0;padding:10px 13px;border-radius:18px;line-height:1.35;font-size:15px}.msg.laia{background:#171717;border:1px solid #292929}.msg.me{background:#fff;color:#050505;margin-left:auto}.composer{display:flex;gap:8px;align-items:center;padding:8px;background:#0c0c0c;border:1px solid #242424;border-radius:24px}.composer input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px;padding:7px 10px}.composer button{border:0;border-radius:50%;width:38px;height:38px;background:#fff;color:#050505;font-size:17px}.composer .voice{background:#1d1d1d;color:#fff}.status{text-align:center;font-size:10px;letter-spacing:.14em;opacity:.35;margin:0 0 4px}
</style>
</head>
<body><main>
<div class="name">LAIA</div>
<div class="face" id="laia"><div class="brow left"></div><div class="brow right"></div><div class="eye left"><div class="pupil"></div></div><div class="eye right"><div class="pupil"></div></div><div class="mouth"></div></div>
<section class="chat"><div class="messages" id="messages"><div class="msg laia">Hey :) Ich bin Laia. Schreib mir was.</div></div><div class="status" id="status">VOICE ON</div><form class="composer" id="form"><button class="voice" id="voice" type="button" aria-label="voice">◉</button><input id="input" autocomplete="off" placeholder="Schreib Laia…" aria-label="Nachricht"><button type="submit" aria-label="send">↑</button></form></section>
</main>
<script>
const laia=document.querySelector("#laia"),pupils=document.querySelectorAll(".pupil"),messages=document.querySelector("#messages"),input=document.querySelector("#input"),form=document.querySelector("#form"),voiceBtn=document.querySelector("#voice"),statusEl=document.querySelector("#status");
let voiceOn=true;
function setMood(m){laia.className="face"+(m?" "+m:"")}
function blink(){if(!laia.classList.contains("talking")){laia.classList.add("blink");setTimeout(()=>laia.classList.remove("blink"),150)}}
setInterval(()=>{if(Math.random()>.55)blink()},1800);
document.addEventListener("pointermove",e=>{const x=(e.clientX/innerWidth-.5)*15,y=(e.clientY/innerHeight-.5)*10;pupils.forEach(p=>p.style.transform=`translate(${x}px,${y}px)`)});
function add(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function chooseVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/de-CH/i.test(v.lang))||vs.find(v=>/de-DE/i.test(v.lang)&&/female|anna|petra|katja/i.test(v.name))||vs.find(v=>/^de/i.test(v.lang))||vs[0]}
function speak(text){if(!voiceOn||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=chooseVoice();if(v)u.voice=v;u.lang=v?.lang||"de-CH";u.rate=1.04;u.pitch=1.12;u.onstart=()=>laia.classList.add("talking");u.onend=()=>laia.classList.remove("talking");speechSynthesis.speak(u)}
speechSynthesis?.getVoices();
function reply(raw){const t=raw.toLowerCase();let r,m="happy";
if(/hallo|hey|hoi|hi\b/.test(t))r="Hii :) Da bist du ja. Was geht dir gerade durch den Kopf?";
else if(/wie geht/.test(t))r="Jetzt gerade? Ziemlich gut. Ich mag, dass du mit mir redest. Und dir?";
else if(/wer bist|was bist/.test(t))r="Ich bin Laia. Noch ziemlich klein, aber ich bekomme langsam Augen, Stimme und Persönlichkeit.";
else if(/müde|schlafen/.test(t)){r="Okay, du klingst müde. Ich halte mich ein bisschen zurück… aber nur ein bisschen.";m=""}
else if(/haha|lol|😂|hahaha/.test(t))r="Hahaha okay, das hat mich jetzt erwischt.";
else if(/liebe|mag dich|süss|süß/.test(t)){r="Awww. Das nehme ich jetzt einfach mal sehr gerne an :)";m="surprised"}
else if(/\?$/.test(raw.trim())){r="Hmm… gute Frage. Ich bin gerade noch die kleine Browser-Version von mir — für echte intelligente Antworten brauchen wir als Nächstes mein KI-Gehirn.";m="skeptical"}
else {const opts=["Okayyy, erzähl weiter 👀","Mhm. Und was macht das gerade mit dir?","Ich hör dir zu :)","Das klingt nach einer Geschichte. Mehr davon."];r=opts[Math.floor(Math.random()*opts.length)]}
setMood(m);setTimeout(()=>{add(r,"laia");speak(r);setTimeout(()=>{if(!laia.classList.contains("talking"))setMood("")},2200)},350)}
form.addEventListener("submit",e=>{e.preventDefault();const t=input.value.trim();if(!t)return;add(t,"me");input.value="";reply(t)});
voiceBtn.addEventListener("click",()=>{voiceOn=!voiceOn;if(!voiceOn)speechSynthesis.cancel();statusEl.textContent=voiceOn?"VOICE ON":"VOICE OFF";voiceBtn.textContent=voiceOn?"◉":"○"});
laia.addEventListener("click",()=>{setMood("happy");speak("Hey. Ich bin da.");setTimeout(()=>{if(!laia.classList.contains("talking"))setMood("")},1800)});
</script></body></html>
