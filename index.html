function installLaiaPixelFace(){

async function consumeAuthCallback(){
 try{
  const hash=new URLSearchParams(location.hash.replace(/^#/,""));

  if(access_token&&refresh_token){

   history.replaceState({},document.title,location.pathname+location.search);
  }
 }catch(e){console.error("LAIA auth callback",e)}
}

function setMood(m){
 ["happy","skeptical","surprised"].forEach(x=>laia.classList.remove(x));
 if(m)laia.classList.add(m)
}
function setVisualState(s){
 ["listening","thinking","talking"].forEach(x=>laia.classList.remove(x));
 if(s)laia.classList.add(s)
}

function add(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function unlockAudio(){
 try{
  const AudioContextCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextCtor)return;
  if(!audioCtx)audioCtx=new AudioContextCtor();
  if(audioCtx.state==="suspended")audioCtx.resume();
 }catch(e){console.error("Audio unlock",e)}
}
async function speak(text){
 if(!voiceOn)return;
 try{
  const session=await refreshGate();
  if(!session)throw new Error("Login required");
  statusEl.textContent="LAIA SPEAKS…";
  try{window.AndroidBridge?.pauseWakeWord?.()}catch{}
  const r=await fetch(SPEAK_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify({text})});
  if(!r.ok)throw new Error("tts "+r.status);
  const bytes=await r.arrayBuffer();
  unlockAudio();
  if(!audioCtx)throw new Error("Audio unavailable");
  const buffer=await audioCtx.decodeAudioData(bytes.slice(0));
  if(currentAudio){try{currentAudio.stop()}catch{}}
  const source=audioCtx.createBufferSource();
  source.buffer=buffer;
  source.connect(audioCtx.destination);
  currentAudio=source;
  setVisualState("talking");
  source.onended=()=>{
   setVisualState("");
   if(currentAudio===source)currentAudio=null;
   if(conversationMode&&window.AndroidBridge&&!document.body.classList.contains("text-open")&&document.visibilityState==="visible"){
    statusEl.textContent="…";
    clearTimeout(followupTimer);
    followupTimer=setTimeout(()=>startMic(true),430)
   }else{
    statusEl.textContent=idleStatus();
    try{window.AndroidBridge?.resumeWakeWord?.()}catch{}
   }
  };
  source.start(0);
 }catch(e){
  console.error("LAIA voice",e);
  setVisualState("");
  conversationMode=false;
  statusEl.textContent="VOICE FAILED";
  try{window.AndroidBridge?.resumeWakeWord?.()}catch{}
 }
}

 };

}

function executeSystemActions(actions){
 if(!window.AndroidBridge||!Array.isArray(actions)||!actions.length)return "";
 const confirmations=[];
 for(const a of actions){
  try{
   if(a.type==="set_alarm"){
    const h=Number(a.hour),m=Number(a.minute||0);
    window.AndroidBridge.setAlarm(h,m,String(a.label||"LAIA"));
    confirmations.push("Wecker auf "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+" Uhr gestellt.");
   }else if(a.type==="set_timer"){
    window.AndroidBridge.setTimer(Number(a.seconds),String(a.label||"LAIA"));
    confirmations.push("Timer läuft.");
   }else if(a.type==="open_app"){
    window.AndroidBridge.openApp(String(a.app||""));
    const names={whatsapp:"WhatsApp",spotify:"Spotify",maps:"Maps",camera:"die Kamera",settings:"die Einstellungen",clock:"die Uhr"};
    confirmations.push((names[a.app]||"Die App")+" ist geöffnet.");
   }else if(a.type==="set_flashlight"){
    const result=window.AndroidBridge.setFlashlight(Boolean(a.enabled));
    confirmations.push(result==="permission_requested"?"Ich brauche kurz Kamerazugriff für die Taschenlampe.":"Taschenlampe "+(a.enabled?"an.":"aus."));
   }else if(a.type==="create_calendar_event"){
    const start=Date.parse(String(a.start_iso||""));
    const end=Date.parse(String(a.end_iso||""));
    if(Number.isFinite(start)){
     window.AndroidBridge.createCalendarEvent(String(a.title||"LAIA"),start,Number.isFinite(end)?end:0,String(a.location||""),String(a.description||""));
     confirmations.push("Kalendereintrag ist vorbereitet.");
    }
   }
  }catch(e){console.error("System action",a,e)}
 }
 return confirmations.join(" ")
}

function base64ToBlob(base64,type){
 const bin=atob(base64),bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new Blob([bytes],{type})
}

function stopMic(){

async function startMic(followup=false){
 if(window.AndroidBridge?.startRecording){
  if(isRecording){window.AndroidBridge.stopRecording();return}
  try{
   clearTimeout(followupTimer);followupTimer=null;
   if(!followup)conversationMode=true;
   stopSpeaking();
   if(!window.AndroidBridge.startRecording("voice"))throw new Error("native mic unavailable");
   isRecording=true;micBtn.classList.add("recording");micBtn.textContent="■";
   setVisualState("listening");statusEl.textContent="ICH HÖRE";
   micTimer=setTimeout(()=>window.AndroidBridge.stopRecording(),19000);
   return
  }catch(e){
   console.error("Native microphone",e);
   setVisualState("");conversationMode=false;statusEl.textContent="MIC FAILED";return
  }
 }
 if(isRecording){stopMic();return}
 if(!navigator.mediaDevices?.getUserMedia||!("MediaRecorder"in window)){statusEl.textContent="MIC UNAVAILABLE";return}
 try{
  stopSpeaking();
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm"];
  const mime=types.find(t=>MediaRecorder.isTypeSupported?.(t))||"";
  mediaRecorder=mime?new MediaRecorder(micStream,{mimeType:mime}):new MediaRecorder(micStream);
  micChunks=[];
  mediaRecorder.ondataavailable=e=>{if(e.data?.size)micChunks.push(e.data)};
  mediaRecorder.onstop=async()=>{
   clearTimeout(micTimer);micTimer=null;isRecording=false;micBtn.classList.remove("recording");micBtn.textContent="●";
   const type=mediaRecorder?.mimeType||micChunks[0]?.type||"audio/webm";
   const blob=new Blob(micChunks,{type});
   micStream?.getTracks().forEach(t=>t.stop());micStream=null;
   if(blob.size<200){statusEl.textContent=voiceOn?"VOICE ON":"VOICE OFF";return}
   try{
    statusEl.textContent="LAIA LISTENS…";
    const session=await refreshGate();if(!session)throw new Error("Login required");
    const r=await fetch(LISTEN_ENDPOINT,{method:"POST",headers:{"Content-Type":type,"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token},body:blob});
    if(!r.ok)throw new Error("stt "+r.status);
    const data=await r.json();const text=(data.text||"").trim();if(!text)throw new Error("empty transcript");
    input.value=text;
    form.requestSubmit();
   }catch(e){console.error("LAIA listen",e);statusEl.textContent="MIC FAILED"}
  };
  mediaRecorder.start();
  isRecording=true;micBtn.classList.add("recording");micBtn.textContent="■";statusEl.textContent="LISTENING…";
  micTimer=setTimeout(stopMic,45000);
 }catch(e){console.error("Microphone",e);statusEl.textContent="MIC PERMISSION?"}
}
function stopMusic(){
 if(musicRecorder&&musicRecorder.state!=="inactive")musicRecorder.stop()
}

async function recognizeMusic(){
 conversationMode=false;clearTimeout(followupTimer);followupTimer=null;
 if(isRecording){statusEl.textContent="STOP MIC FIRST";return}
 if(window.AndroidBridge?.startRecording){
  if(isMusicListening){window.AndroidBridge.stopRecording();return}
  try{
   stopSpeaking();
   if(!window.AndroidBridge.startRecording("music"))throw new Error("native music mic unavailable");
   isMusicListening=true;musicBtn.classList.add("listening");musicBtn.textContent="■";setVisualState("listening");statusEl.textContent="MUSIK…";
   musicTimer=setTimeout(()=>window.AndroidBridge.stopRecording(),12000);
   return
  }catch(e){console.error("Native music microphone",e);statusEl.textContent="MUSIC FAILED";return}
 }
 if(isMusicListening){stopMusic();return}
 if(!navigator.mediaDevices?.getUserMedia||!("MediaRecorder"in window)){statusEl.textContent="MUSIC UNAVAILABLE";return}
 try{
  stopSpeaking();
  musicStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm"];
  const mime=types.find(t=>MediaRecorder.isTypeSupported?.(t))||"";
  musicRecorder=mime?new MediaRecorder(musicStream,{mimeType:mime}):new MediaRecorder(musicStream);
  musicChunks=[];
  musicRecorder.ondataavailable=e=>{if(e.data?.size)musicChunks.push(e.data)};
  musicRecorder.onstop=async()=>{
   clearTimeout(musicTimer);musicTimer=null;isMusicListening=false;musicBtn.classList.remove("listening");musicBtn.textContent="♫";
   const type=musicRecorder?.mimeType||musicChunks[0]?.type||"audio/webm";
   const blob=new Blob(musicChunks,{type});
   musicStream?.getTracks().forEach(t=>t.stop());musicStream=null;
   if(blob.size<500){statusEl.textContent=voiceOn?"VOICE ON":"VOICE OFF";return}
   try{
    statusEl.textContent="RECOGNIZING…";
    const session=await refreshGate();if(!session)throw new Error("Login required");
    const r=await fetch(MUSIC_ENDPOINT,{method:"POST",headers:{"Content-Type":type,"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token},body:blob});
    if(!r.ok)throw new Error("music "+r.status);
    const data=await r.json();
    const m=data.match;
    if(!m){
      const msg="Hmm. Den Track habe ich nicht erkannt.";
      add(msg,"laia");if(voiceOn)speak(msg);
    }else{
      const album=m.album?" — "+m.album:"";
      const msg="♪ "+m.artist+" — "+m.title+album;
      add(msg,"laia");
      const spoken="Das ist "+m.title+" von "+m.artist+".";
      if(voiceOn)speak(spoken);
    }
   }catch(e){console.error("LAIA music",e);statusEl.textContent="MUSIC FAILED"}
  };
  musicRecorder.start();
  isMusicListening=true;musicBtn.classList.add("listening");musicBtn.textContent="■";statusEl.textContent="LISTENING FOR MUSIC…";
  musicTimer=setTimeout(stopMusic,12000);
 }catch(e){console.error("Music microphone",e);statusEl.textContent="MIC PERMISSION?"}
}

function localReply(raw){const t=raw.toLowerCase();let r,m="happy";
if(/hallo|hey|hoi|hi\b/.test(t))r="Hii :) Da bist du ja. Was geht dir gerade durch den Kopf?";
else if(/wie geht/.test(t))r="Jetzt gerade? Ziemlich gut. Ich mag, dass du mit mir redest. Und dir?";
else if(/wer bist|was bist/.test(t))r="Ich bin Laia. Noch ziemlich klein, aber ich bekomme langsam Augen, Stimme und Persönlichkeit.";
else if(/müde|schlafen/.test(t)){r="Okay, du klingst müde. Ich halte mich ein bisschen zurück… aber nur ein bisschen.";m=""}
else if(/haha|lol|😂|hahaha/.test(t))r="Hahaha okay, das hat mich jetzt erwischt.";
else if(/liebe|mag dich|süss|süß/.test(t)){r="Awww. Das nehme ich jetzt einfach mal sehr gerne an :)";m="surprised"}
else if(/\?$/.test(raw.trim())){r="Hmm… gute Frage. Ich bin gerade noch die kleine Browser-Version von mir — für echte intelligente Antworten brauchen wir als Nächstes mein KI-Gehirn.";m="skeptical"}
else {const opts=["Okayyy, erzähl weiter 👀","Mhm. Und was macht das gerade mit dir?","Ich hör dir zu :)","Das klingt nach einer Geschichte. Mehr davon."];r=opts[Math.floor(Math.random()*opts.length)]}
setMood(m);setTimeout(()=>{add(r,"laia");speak(r);setTimeout(()=>{if(!laia.classList.contains("talking"))setMood("")},2200)},350)}
form.addEventListener("submit",async e=>{
 e.preventDefault();if(voiceOn)unlockAudio();
 const t=input.value.trim();if(!t)return;
 add(t,"me");input.value="";
 if(!(await refreshGate()))return;
 setVisualState("thinking");statusEl.textContent="DENKE…";
 try{
  const data=await brainReply(t);
  const actionText=executeSystemActions(data.actions||[]);
  let r=(data.reply||"").trim();
  if(actionText&&(!r||/^okay[.!]?$/i.test(r)))r=actionText;
  else if(actionText&&r)r=r+" "+actionText;
  if(!r)throw new Error("Empty reply");
  setMood("happy");add(r,"laia");speak(r)
 }catch(err){
  console.error(err);add("Mein Gehirn ist gerade nicht erreichbar. Versuch es gleich nochmal.","laia");setMood("skeptical")
 }finally{
  if(!laia.classList.contains("talking"))statusEl.textContent=idleStatus()
 }
});
voiceBtn.addEventListener("click",()=>{voiceOn=!voiceOn;if(voiceOn)unlockAudio();if(!voiceOn)stopSpeaking();statusEl.textContent=voiceOn?idleStatus():"VOICE OFF";voiceBtn.textContent=voiceOn?"◉":"○"});
textToggle.addEventListener("click",()=>{
 const opening=!document.body.classList.contains("text-open");
 document.body.classList.toggle("text-open");
 if(opening){
  conversationMode=false;clearTimeout(followupTimer);followupTimer=null;
  try{window.AndroidBridge?.resumeWakeWord?.()}catch{}
  setTimeout(()=>input.focus(),80)
 }
});
micBtn.addEventListener("click",startMic);
musicBtn.addEventListener("click",recognizeMusic);

window.receiveWakePhrase=(text)=>{
 const t=String(text||"").trim();
 conversationMode=true;
 statusEl.textContent="ICH HÖRE";
 setVisualState("listening");
 if(t){
  setVisualState("thinking");
  input.value=t;form.requestSubmit()
 }else startMic(true)
};

laia.addEventListener("click",()=>{
 unlockAudio();
 if(window.AndroidBridge){conversationMode=true;startMic(true);return}
 setMood("happy");speak("Hey. Ich bin da.");setTimeout(()=>{if(!laia.classList.contains("talking"))setMood("")},1800)
});

if(window.AndroidBridge){statusEl.textContent="HEY LAIA";try{window.AndroidBridge.setWakeWordEnabled(true)}catch{}}
</script></body></html>
